specVersion: '2.6'
metadata:
  name: sap-ui5-analytical-app
  namespace: com/tharaneeshwar/analyticalapp
  version: 1.0.0
type: application
framework:
  name: OpenUI5
  version: 1.120.0
  libraries:
    - name: sap.fiori
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.layout
    - name: sap.ui.table
    - name: sap.ui.comp
    - name: sap.ui.unified
    - name: sap.suite.ui.microchart
    - name: sap.viz

serve:
  port: 8080
  livereload: true

build:
  componentPreload:
    - src/com/tharaneeshwar/analyticalapp/Component.js
    - src/com/tharaneeshwar/analyticalapp/manifest.json
  minification: true
  bundleDefinition: []
