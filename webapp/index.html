<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP UI5 Fiori Analytical Application</title>
    <script
        id="sap-ui-bootstrap"
        src="https://openui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "com.tharaneeshwar.analyticalapp": "./"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-preload="async"
        data-sap-ui-compatversion="edge"
        data-sap-ui-libs="sap.ui.core,sap.ui.layout,sap.m,sap.uxap,sap.ui.table,sap.ui.comp,sap.suite.ui.microchart,sap.viz"
    ></script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="com.tharaneeshwar.analyticalapp"
        data-settings='{"id": "analyticalApp"}'
        data-handle-validation="true"
        style="height: 100%">
    </div>
</body>
</html>
